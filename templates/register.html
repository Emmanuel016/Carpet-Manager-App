<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Customer Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-card h2 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 5px;
            font-weight: 700;
            text-align: center;
        }

        .register-subtitle {
            font-size: 14px;
            color: #a5b4fc;
            text-align: center;
            margin-bottom: 30px;
        }

        .field-container {
            position: relative;
            margin-bottom: 20px;
        }

        .field-container i {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #6366f1;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn-auth {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.8);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        .auth-footer {
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
        }

        .auth-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <h2>Create Account</h2>
            <p class="register-subtitle">Join Customer Manager today</p>

            <form method="POST" action="/register">
                <div class="field-container">
                    <i class="fa-solid fa-user"></i>
                    <input name="username" placeholder="Username" required autocomplete="username">
                </div>

                <div class="field-container">
                    <i class="fa-solid fa-envelope"></i>
                    <input name="email" type="email" placeholder="Email" required autocomplete="email">
                </div>

                <div class="field-container">
                    <i class="fa-solid fa-building"></i>
                    <input name="company" placeholder="Company Name" required autocomplete="organization">
                </div>

                <div class="field-container">
                    <i class="fa-solid fa-key"></i>
                    <input name="password" type="password" placeholder="Password" required autocomplete="new-password">
                </div>

                {% if error %}
                    <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
                {% endif %}

                <button type="submit" class="btn-auth">
                    Register
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
